name: Daily Analytics ELT

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: daily-marketing-elt
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  refresh:
    name: Refresh analytics pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      API_PAGE_SIZE: ${{ vars.API_PAGE_SIZE || '1000' }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      RDS_SECRET_ID: ${{ secrets.RDS_SECRET_ID }}
      RDS_SECURITY_GROUP_ID: ${{ secrets.RDS_SECURITY_GROUP_ID }}
      POSTGRES_SSLMODE: verify-full
      POSTGRES_CONNECT_TIMEOUT_SECONDS: "15"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load database connection settings
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value \
            --secret-id "$RDS_SECRET_ID" \
            --query SecretString \
            --output text \
            --no-cli-pager \
          | python scripts/export_rds_secret.py

      - name: Download Amazon RDS trust bundle
        run: |
          set -euo pipefail
          POSTGRES_SSLROOTCERT="${RUNNER_TEMP}/global-bundle.pem"
          echo "POSTGRES_SSLROOTCERT=$POSTGRES_SSLROOTCERT" >> "$GITHUB_ENV"

          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --location \
            --output "$POSTGRES_SSLROOTCERT" \
            https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          test -s "$POSTGRES_SSLROOTCERT"

      - name: Authorize this runner for PostgreSQL
        id: authorize_runner
        run: |
          set -euo pipefail
          runner_ip="$(curl --fail --silent --show-error https://checkip.amazonaws.com)"
          runner_cidr="${runner_ip}/32"
          aws ec2 authorize-security-group-ingress \
            --group-id "$RDS_SECURITY_GROUP_ID" \
            --ip-permissions \
              "IpProtocol=tcp,FromPort=5432,ToPort=5432,IpRanges=[{CidrIp=${runner_cidr},Description=github-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}]" \
            --no-cli-pager
          echo "runner_cidr=$runner_cidr" >> "$GITHUB_OUTPUT"
          echo "authorized=true" >> "$GITHUB_OUTPUT"

      - name: Wait for PostgreSQL network access
        run: |
          python - <<'PYTHON'
          import os
          import socket
          import time

          host = os.environ["POSTGRES_HOST"]
          port = int(os.environ.get("POSTGRES_PORT", "5432"))
          attempts = 12
          delay_seconds = 5

          for attempt in range(1, attempts + 1):
              try:
                  with socket.create_connection((host, port), timeout=5):
                      print("PostgreSQL network access is ready.")
                      break
              except OSError:
                  if attempt == attempts:
                      raise SystemExit(
                          "PostgreSQL remained unreachable after "
                          f"{attempts} attempts."
                      )

                  print(
                      f"PostgreSQL is not reachable yet "
                      f"(attempt {attempt}/{attempts}); retrying..."
                  )
                  time.sleep(delay_seconds)
          PYTHON

      - name: Run daily ELT
        run: python -m extract_load.run_daily_pipeline --apply

      - name: Remove runner PostgreSQL authorization
        if: ${{ always() && steps.authorize_runner.outputs.authorized == 'true' }}
        run: |
          set -euo pipefail
          aws ec2 revoke-security-group-ingress \
            --group-id "$RDS_SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 5432 \
            --cidr "${{ steps.authorize_runner.outputs.runner_cidr }}" \
            --no-cli-pager
